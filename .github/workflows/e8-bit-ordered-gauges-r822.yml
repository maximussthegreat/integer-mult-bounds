name: E8 bit ordered gauges R822

on:
  pull_request:
    paths:
      - 'research/e8-bit-ordered-gauges-r822/**'
      - '.github/workflows/e8-bit-ordered-gauges-r822.yml'

permissions:
  contents: read

jobs:
  standalone-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-11
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-11
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run only the standalone independently authored checks
        shell: bash
        run: |
          set -o pipefail
          python -B research/e8-bit-ordered-gauges-r822/verify.py 2>&1 | tee e8-bit-ordered-gauges-r822.log
      - name: Retain failed verification log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-10-11
        with:
          name: e8-bit-ordered-gauges-r822-python-${{ matrix.python-version }}
          path: e8-bit-ordered-gauges-r822.log
          if-no-files-found: ignore
          retention-days: 7
